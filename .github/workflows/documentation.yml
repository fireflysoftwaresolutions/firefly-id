name: Documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tooling/*documentation*'
      - 'tooling/mkdocs_hooks.py'
      - 'tests/test_documentation.py'
      - 'tests/test_product_handbook.py'
      - 'assets/**'
      - 'config/authentication-policies.json'
      - 'deploy/images.lock.json'
      - '.github/workflows/documentation.yml'
      - '.openai/hosting.json'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tooling/*documentation*'
      - 'tooling/mkdocs_hooks.py'
      - 'tests/test_documentation.py'
      - 'tests/test_product_handbook.py'
      - 'assets/**'
      - 'config/authentication-policies.json'
      - 'deploy/images.lock.json'
      - '.github/workflows/documentation.yml'
      - '.openai/hosting.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handbook:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Source presubmit
        run: make check
      - name: Install pinned documentation dependencies
        run: |
          mkdir -p .work/documentation
          python -m pip install --disable-pip-version-check -r requirements-docs.txt
          python -m pip list --format=json > .work/documentation/dependencies.json
      - name: Install pinned owned browser tools
        working-directory: tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Install the pinned build-time diagram engine
        run: |
          npm install --prefix .work/docs-diagrams --no-save --package-lock=false --ignore-scripts --no-audit --no-fund mermaid@12.2.0
          npm list --prefix .work/docs-diagrams --json --all > .work/documentation/diagram-dependencies.json
      - name: Render static light and dark product diagrams
        run: node tooling/documentation-diagrams.mjs
      - name: Strict MkDocs build
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}
        run: python -m mkdocs build --strict
      - name: Validate actual static output and provenance
        run: python3 tooling/validate_documentation.py
      - name: Package exact static output
        run: tar -czf .work/documentation/handbook.tar.gz -C .work/documentation site
      - name: Actual reading, search and navigation in both appearances
        run: node tooling/documentation-runtime.mjs
      - name: Upload qualified GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', vars.DOCS_PUBLISH_BRANCH || 'main')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .work/documentation/site
      - name: Preserve bounded documentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-handbook-evidence
          path: |
            .work/documentation/output-summary.json
            .work/documentation/dependencies.json
            .work/documentation/diagram-dependencies.json
            .work/documentation/diagrams/summary.json
            .work/documentation/site/documentation-provenance.json
            .work/documentation/browser/summary.json
            .work/documentation/browser/*.png
            .work/documentation/handbook.tar.gz
          if-no-files-found: ignore
          retention-days: 14

  pages:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', vars.DOCS_PUBLISH_BRANCH || 'main')
    needs: handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: identity-github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
      - name: Deploy tested artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
