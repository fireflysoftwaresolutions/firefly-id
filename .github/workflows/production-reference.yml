name: Production reference

on:
  push:
    paths:
      - 'deploy/keycloak.production.conf.example'
      - 'deploy/images.lock.json'
      - 'scripts/check_production.py'
      - 'tests/test_production.py'
      - '.github/workflows/production-reference.yml'
  pull_request:
    paths:
      - 'deploy/keycloak.production.conf.example'
      - 'deploy/images.lock.json'
      - 'scripts/check_production.py'
      - 'tests/test_production.py'
      - '.github/workflows/production-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Candidate security refusal regressions
        run: python3 -m unittest discover -s tests -p test_production.py -v
      - name: Parse the reference with the actual pinned Keycloak distribution
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          output = root / '.work/production-reference'
          output.mkdir(parents=True, exist_ok=True)
          image = json.loads((root / 'deploy/images.lock.json').read_text())['keycloak']['image']
          reference = root / 'deploy/keycloak.production.conf.example'
          result = {'scope': 'Pinned server configuration parsing only; no database/network/TLS handshake or production acceptance',
                    'source': os.environ['GITHUB_SHA'], 'reference_sha256': hashlib.sha256(reference.read_bytes()).hexdigest(),
                    'image': image, 'verified': [], 'failures': []}
          expected = {'db-tls-mode': 'verify-server', 'db-tls-trust-store-file': '/run/secrets/database-ca.pem',
                      'http-enabled': 'false', 'http-management-scheme': 'inherited',
                      'hostname-strict': 'true', 'hostname-backchannel-dynamic': 'false',
                      'https-protocols': 'TLSv1.3,TLSv1.2', 'tls-hostname-verifier': 'DEFAULT',
                      'legacy-observability-interface': 'false'}
          stage = 'IMAGE_PULL'
          try:
              subprocess.run(['docker', 'pull', image], check=True, timeout=240,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              command = ['docker', 'run', '--rm', '--network', 'none',
                         '--mount', f'type=bind,source={reference},target=/opt/keycloak/conf/candidate.conf,readonly']
              for key, value in {'FIREFLY_ID_DATABASE_URL': 'jdbc:postgresql://db.example.net/identity',
                                 'FIREFLY_ID_DATABASE_USER': 'identity_service',
                                 'FIREFLY_ID_PUBLIC_URL': 'https://id.example.net',
                                 'FIREFLY_ID_ADMIN_URL': 'https://admin.example.net',
                                 'FIREFLY_ID_PROXY_CIDRS': '10.24.0.0/24'}.items():
                  command.extend(['--env', key + '=' + value])
              command.extend([image, '--config-file=/opt/keycloak/conf/candidate.conf', 'show-config', 'all'])
              stage = 'SHOW_CONFIG'
              parsed = subprocess.run(command, capture_output=True, text=True, timeout=120, check=True)
              stage = 'EXPECTED_OPTIONS'
              for key, value in expected.items():
                  if not re.search(r'(?m)^\s*kc\.' + re.escape(key) + r'\s*=\s*' + re.escape(value) + r'(?:\s|$)', parsed.stdout):
                      result['failures'].append(key)
                  else:
                      result['verified'].append(key)
          except (subprocess.SubprocessError, OSError):
              result['failures'].append('PINNED_CONFIGURATION_PARSE')
              result['failure_stage'] = stage
          (output / 'summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          raise SystemExit(1 if result['failures'] else 0)
          PY
      - name: Preserve bounded configuration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-reference-evidence
          path: .work/production-reference/summary.json
          if-no-files-found: ignore
          retention-days: 14
