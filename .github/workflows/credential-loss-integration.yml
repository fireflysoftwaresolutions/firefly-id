name: Credential-loss native and KYC integration

on:
  workflow_dispatch:
    inputs:
      domain_sha:
        description: Exact customer Domain source with genuine Core KYCB SDK
        required: true
        type: string
      core_sha:
        description: Exact durable Core KYCB proofing authority source
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: credential-loss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-native-proofing-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/domain-customer-kyc-kyb
          ref: ${{ inputs.domain_sha }}
          path: .qualification/reproofing-domain
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/core-common-kycb-mgmt
          ref: ${{ inputs.core_sha }}
          path: .qualification/reproofing-domain/.qualification/core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fireflysoftwaresolutions/firefly-parent
          ref: 6442bd51733ade4d5f4583e1afe812dd2c520b40
          path: .qualification/reproofing-domain/.qualification/firefly-parent
      - name: Verify immutable producer and consumer sources
        env:
          CORE_PIN: ${{ inputs.core_sha }}
          DOMAIN_PIN: ${{ inputs.domain_sha }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          for variable,source in [('DOMAIN_PIN','.qualification/reproofing-domain'),('CORE_PIN','.qualification/reproofing-domain/.qualification/core')]:
              pin=os.environ[variable]
              assert re.fullmatch('[0-9a-f]{40}',pin)
              assert subprocess.check_output(['git','-C',source,'rev-parse','HEAD'],text=True).strip()==pin
          assert Path('.qualification/reproofing-domain/tooling/reproofing-core-source.txt').read_text().strip()==os.environ['CORE_PIN']
          print('Exact KYC producer and Domain sources selected; no released artifact replaced.')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test exact native extension candidates
        run: |
          umask 077
          mkdir -p .qualification
          status=0
          mvn -B -ntp -f extensions/pom.xml -Dmaven.repo.local="$RUNNER_TEMP/reproofing-native-m2" verify > .qualification/native-maven.log 2>&1 || status=$?
          python3 tooling/summarize_native_build.py "$status"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build actual Core producer, genuine candidate SDK and Domain
        working-directory: .qualification/reproofing-domain
        run: python3 tooling/prepare_reproofing_sdk_fixture.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned owned browser tooling
        working-directory: tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Prepare owned proofing fixture and native branding
        run: |
          python3 tooling/build_theme.py
          python3 tooling/reproofing_integration_fixture.py prepare
      - name: Start actual native and customer proofing owners
        run: python3 tooling/reproofing_integration_fixture.py start
      - name: Exercise actual credential replacement and boundary refusals
        run: node tooling/reproofing-runtime.mjs
      - name: Retain only bounded evidence and credential-free captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: credential-loss-integration-evidence
          path: |
            .work/reproofing-integration/summary.json
            .work/reproofing-integration/manifest.json
            .work/reproofing-integration/fonts.json
            .work/reproofing-integration/boot-summary.json
            .work/reproofing-integration/*-empty-form-*.png
            .work/reproofing-integration/*-complete-*.png
            .qualification/native-build-summary.json
            .qualification/reproofing-domain/.qualification/reproofing-sdk-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop only owned attempt processes, preserving retained evidence
        if: always()
        run: python3 tooling/reproofing_integration_fixture.py stop
