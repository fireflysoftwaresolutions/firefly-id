name: Native support concurrency and retained migration

on:
  workflow_dispatch:
  push:
    paths: ['qualification/support-retained/**', 'tooling/support_retained_qualification.py', 'tooling/package_native.py', 'tests/test_support_retained_qualification.py', 'tests/test_native_packaging.py', 'extensions/**', '.github/workflows/support-retained.yml']

permissions:
  contents: read

concurrency:
  group: support-retained-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-native-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build real native service and independent fixture package
        run: |
          umask 077
          mkdir -p .qualification
          native_status=0
          mvn -B -ntp -f extensions/pom.xml -Dmaven.repo.local="$RUNNER_TEMP/support-retained-m2" install > .qualification/native-maven.log 2>&1 || native_status=$?
          python3 tooling/summarize_native_build.py "$native_status"
          fixture_status=0
          mvn -B -ntp -f qualification/support-retained/pom.xml -Dmaven.repo.local="$RUNNER_TEMP/support-retained-m2" package > .qualification/support-retained-fixture.log 2>&1 || fixture_status=$?
          python3 - "$fixture_status" <<'PY'
          import json,sys
          from pathlib import Path
          from tooling.support_retained_qualification import bounded_diagnostics
          status=int(sys.argv[1])
          receipt={'result':'passed' if status==0 else 'failed','maven_exit_code':status,'scope':'Separate qualification adapter compilation only'}
          receipt.update(bounded_diagnostics(Path('.qualification/support-retained-fixture.log').read_text(errors='replace')))
          Path('.qualification/support-retained-fixture-build.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          raise SystemExit(status)
          PY
      - name: Package ordinary production inputs without the adapter
        run: |
          python3 tooling/build_theme.py
          python3 tooling/package_native.py \
            --native-jar extensions/native-recovery/target/firefly-id-native-recovery-26.10.1-SNAPSHOT.jar \
            --gateway-jar extensions/native-domain-gateway/target/firefly-id-native-domain-gateway-26.10.1-SNAPSHOT.jar \
            --output dist/native
      - name: Exercise real native transactions and same retained PostgreSQL
        run: |
          umask 077
          python3 tooling/support_retained_qualification.py
      - name: Publish bounded evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: support-retained-summary
          path: |
            .qualification/support-retained/summary.json
            .qualification/native-build-summary.json
            .qualification/support-retained-fixture-build.json
          if-no-files-found: ignore
          retention-days: 14
