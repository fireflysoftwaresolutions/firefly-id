name: Synthetic master profile import and retained transition

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/master-transition.yml'
      - 'tooling/master_transition_fixture.py'
      - 'tooling/master-transition-runtime.mjs'
      - 'tooling/master-action-links.mjs'
      - 'tooling/master-callback.mjs'
      - 'tooling/privileged_profile.py'
      - 'tests/test_master_transition.py'
      - 'tests/master-transition-runtime.test.mjs'
      - 'tests/master-action-links.test.mjs'
      - 'tests/master-callback.test.mjs'
      - 'tests/test_privileged_profile.py'

permissions:
  contents: read

concurrency:
  group: master-transition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test native extension only
        run: |
          umask 077
          mkdir -p .qualification
          status=0
          mvn -B -ntp -f extensions/pom.xml -Dmaven.repo.local="$RUNNER_TEMP/master-native-m2" verify > .qualification/native-maven.log 2>&1 || status=$?
          python3 tooling/summarize_native_build.py "$status"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned hosted browser tooling
        working-directory: tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Prepare fresh synthetic master and trusted TLS
        run: |
          python3 tooling/build_theme.py
          python3 tooling/master_transition_fixture.py prepare
          python3 tooling/master_transition_fixture.py start
      - name: Qualify exact import and original retained transition separately
        run: node tooling/master-transition-runtime.mjs
      - name: Preserve bounded evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-master-transition-evidence
          path: |
            .work/master-transition/summary.json
            .work/master-transition/lifecycle-summary.json
            .qualification/native-build-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only this attempt's owned containers
        if: always()
        run: |
          state=".state/master-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/ownership.json"
          if test -f "$state"; then python3 tooling/master_transition_fixture.py stop; fi
