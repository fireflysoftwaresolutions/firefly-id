name: Native extension qualification

on:
  workflow_dispatch:
  push:
    paths: ['extensions/**', 'tooling/summarize_native_build.py', '.github/workflows/native-source-qualification.yml']
  pull_request:
    paths: ['extensions/**', 'tooling/summarize_native_build.py', '.github/workflows/native-source-qualification.yml']

permissions:
  contents: read

jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test the pinned native extensions
        run: |
          umask 077
          mkdir -p .qualification
          native_maven_status=0
          mvn -B -ntp -f extensions/pom.xml -Dmaven.repo.local="$RUNNER_TEMP/firefly-native-m2" verify > .qualification/native-maven.log 2>&1 || native_maven_status=$?
          python3 tooling/summarize_native_build.py "$native_maven_status"
      - name: Preserve bounded native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-build-summary
          path: .qualification/native-build-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve native installation candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-extension-candidates
          path: |
            extensions/native-recovery/target/firefly-id-native-recovery-26.10.1-SNAPSHOT.jar
            extensions/native-domain-gateway/target/firefly-id-native-domain-gateway-26.10.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
