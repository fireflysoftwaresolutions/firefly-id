name: Qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: make check theme
      - name: Validate generated Compose without starting services
        run: |
          python3 scripts/generate.py --mode sandbox --output .state/source-check
          docker compose -f .state/source-check/compose.json config --quiet
      - name: Preserve reproducible theme package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefly-identity-theme
          path: |
            dist/firefly-id-theme.jar
            dist/SHA256SUMS
          retention-days: 14

  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare owned synthetic runtime
        id: owned-runtime
        run: |
          python3 tooling/build_theme.py
          python3 scripts/generate.py --mode sandbox
          printf '\n127.0.0.1 id.firefly.test\n' | sudo tee -a /etc/hosts >/dev/null
          python3 scripts/sandbox.py preflight
          python3 scripts/sandbox.py pull
          python3 scripts/sandbox.py up
      - name: Install pinned browser test tools
        id: browser-tools
        working-directory: tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Compile the genuine Jafly fixture before issuing short-lived tokens
        run: mvn -B -ntp -f examples/jafly/pom.xml test-compile
      - name: Real OIDC browser and recovery flows
        run: node tooling/runtime.mjs
      - name: Genuine published Jafly resource-server integration
        env:
          FIREFLY_ID_TOKEN_FILE: ${{ github.workspace }}/.state/sandbox/runtime-token.txt
        run: mvn -B -ntp -f examples/jafly/pom.xml test
      - name: Verification, protected profile and workforce MFA
        run: node tooling/extended-runtime.mjs
      - name: Authentication policy and population isolation
        if: ${{ !cancelled() && steps.owned-runtime.outcome == 'success' && steps.browser-tools.outcome == 'success' }}
        run: node tooling/policy-runtime.mjs
      - name: Interactive client receiver audience shapes
        if: ${{ !cancelled() && steps.owned-runtime.outcome == 'success' && steps.browser-tools.outcome == 'success' }}
        run: node tooling/receiver-audience-runtime.mjs
      - name: English and Spanish identity journeys
        if: ${{ !cancelled() && steps.owned-runtime.outcome == 'success' && steps.browser-tools.outcome == 'success' }}
        run: node tooling/localization-runtime.mjs
      - name: Preserve redacted visual and result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-visual-evidence
          path: |
            .work/runtime/*.png
            .work/runtime/summary.json
            .work/runtime/layout.json
            .work/runtime/*-diagnostics.json
            .work/runtime/*-contrast.json
            .work/runtime/*-layout.json
            .work/extended-runtime/summary.json
            .work/policy-runtime/summary.json
            .work/policy-runtime/*.png
            .work/policy-runtime/*-layout.json
            .work/policy-runtime/admin-credentials-diagnostics.json
            .work/receiver-audiences/summary.json
            .work/localization-runtime/*.png
            .work/localization-runtime/summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only the owned runtime
        if: always()
        run: |
          if test -f .state/sandbox/ownership.json; then
            python3 scripts/sandbox.py stop
          fi
