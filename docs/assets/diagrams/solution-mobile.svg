<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title desc">
  <title id="title">Separate identity and business authority</title><desc id="desc">People authenticate with Firefly Identity. Experience, Domain and Core each validate their incoming identity and operation policy. Applications connect through standard OIDC interfaces.</desc>
  <style>@font-face{font-family:Manrope;src:url('__MANROPE_DATA_URI__') format('woff2');font-weight:200 800}text{font-family:Manrope,sans-serif;fill:#f3f1eb}.heading{font-size:29px;font-weight:600}.secondary{font-size:23px;fill:#bfb8ab}.box{fill:#272820;stroke:#474a42}.line{stroke:#bfb8ab;stroke-width:2;fill:none}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#bfb8ab" stroke-width="1.3"/></marker></defs>
  <rect width="600" height="830" rx="12" fill="#10110f"/>
  <text x="32" y="55" class="heading">Explicit authority at every layer</text>
  <path d="M300 172V204" class="line" marker-end="url(#arrow)"/>
  <path d="M300 312V344" class="line" marker-end="url(#arrow)"/>
  <path d="M300 452V484" class="line" marker-end="url(#arrow)"/>
  <path d="M300 592V624" class="line" marker-end="url(#arrow)"/>
  <rect x="32" y="90" width="536" height="82" rx="8" class="box"/><text x="55" y="125" class="heading">Customers / Workforce</text><text x="55" y="154" class="secondary">Separate identity profiles</text>
  <rect x="32" y="210" width="536" height="102" rx="8" class="box"/><text x="55" y="250" class="heading">Firefly Identity</text><text x="55" y="286" class="secondary">Credentials · factors · sessions</text>
  <rect x="32" y="350" width="536" height="102" rx="8" class="box"/><text x="55" y="390" class="heading">Experience</text><text x="55" y="426" class="secondary">Verify identity and authorize operation</text>
  <rect x="32" y="490" width="536" height="102" rx="8" class="box"/><text x="55" y="530" class="heading">Domain</text><text x="55" y="566" class="secondary">Orchestration · third-party adapters</text>
  <rect x="32" y="630" width="536" height="102" rx="8" class="box"/><text x="55" y="670" class="heading">Core</text><text x="55" y="706" class="secondary">Business records · KYC/KYB SoR</text>
  <text x="32" y="777" class="secondary">Recovery authority is purpose-bound.</text><text x="32" y="810" class="secondary">Standard OIDC application integration.</text>
</svg>
