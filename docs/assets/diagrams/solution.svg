<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="title desc">
  <title id="title">Identity and business authority have independent owners</title>
  <desc id="desc">Customers and workforce authenticate through Firefly Identity. Experience, Domain and Core independently authorize incoming requests. Core returns only a purpose-bound recovery authorization to Identity.</desc>
  <style>@font-face{font-family:Manrope;src:url('__MANROPE_DATA_URI__') format('woff2');font-weight:200 800}text{font-family:Manrope,sans-serif;fill:#f3f1eb}.secondary{fill:#bfb8ab;font-size:16px}.heading{font-size:23px;font-weight:600}.line{fill:none;stroke:#bfb8ab;stroke-width:2}.box{fill:#272820;stroke:#474a42;stroke-width:1}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#bfb8ab" stroke-width="1.3"/></marker></defs>
  <rect width="1040" height="460" rx="12" fill="#10110f"/>
  <text x="40" y="48" class="heading">Independent identities. Explicit authority.</text>
  <path d="M270 147H348M670 147H748M880 215V286M750 340H670" class="line" marker-end="url(#arrow)"/>
  <path d="M515 290V219" fill="none" stroke="#ffb34a" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="40" y="100" width="230" height="115" rx="8" class="box"/>
  <text x="60" y="139" class="heading">Customers</text><text x="60" y="172" class="heading">Workforce</text><text x="60" y="198" class="secondary">Separate trust profiles</text>
  <rect x="360" y="100" width="310" height="115" rx="8" class="box"/>
  <text x="382" y="139" class="heading">Firefly Identity</text><text x="382" y="172" class="secondary">Credentials · factors · sessions</text><text x="382" y="198" class="secondary">Keycloak + Firefly extensions</text>
  <rect x="750" y="100" width="250" height="115" rx="8" class="box"/>
  <text x="772" y="139" class="heading">Experience</text><text x="772" y="172" class="secondary">Verify incoming identity</text><text x="772" y="198" class="secondary">Authorize the operation</text>
  <rect x="750" y="290" width="250" height="110" rx="8" class="box"/>
  <text x="772" y="330" class="heading">Domain</text><text x="772" y="365" class="secondary">Orchestration · adapters</text>
  <rect x="360" y="290" width="310" height="110" rx="8" class="box"/>
  <text x="382" y="330" class="heading">Core</text><text x="382" y="365" class="secondary">Business records · KYC/KYB SoR</text>
  <text x="40" y="340" class="secondary">Every receiving layer</text><text x="40" y="365" class="secondary">validates its caller and policy.</text>
  <text x="40" y="256" font-size="14" fill="#ffb34a" style="fill:#ffb34a">Purpose-bound recovery only</text>
  <text x="40" y="434" class="secondary">Jafly remains independent of Identity and the verification provider.</text>
</svg>
